# PROGRAMS LAYOUT VARIANT — choose ONE:
#
#   accordion - Programs listed as expandable items. Great for many programs.
#   cards     - Each program shown as a full card. Better for 2–4 programs.
#
programsVariant: cards

# ---------------------------------------------------------------------------
# DEGREE PROGRAMS
# ---------------------------------------------------------------------------
# type must be one of: undergraduate, graduate, postgraduate
programs:
  - name: "Bachelor of Arts in Communication"
    abbreviation: "BA Comm"
    description: "A dynamic program that builds mastery in journalism, strategic communication, digital media, and broadcast. Students learn to craft compelling narratives and manage media campaigns in a rapidly evolving digital landscape."
    duration: "4 years"
    type: "undergraduate"
    objectives:
      - "Develop competent communication practitioners skilled in media production and strategic messaging."
      - "Foster critical thinking and ethical standards in journalism and public information."
      - "Cultivate adaptability in digital media, public relations, and corporate communication."
    outcomes:
      - "Produce multi-platform media content adhering to professional and ethical standards."
      - "Design and implement strategic communication campaigns for diverse audiences."
      - "Analyze media trends and their impact on society and culture."
    careerOpportunities:
      - "Broadcast Journalist / News Anchor"
      - "Public Relations Specialist"
      - "Digital Content Creator / Strategist"
      - "Corporate Communications Manager"
      - "Media Producer"

  - name: "Bachelor of Science in Psychology"
    abbreviation: "BS Psych"
    description: "A science-based program exploring human behavior, mental processes, and emotional well-being. It prepares students for careers in clinical, industrial, educational, and developmental psychology."
    duration: "4 years"
    type: "undergraduate"
    objectives:
      - "Provide a strong foundation in psychological theories, research methods, and ethical practice."
      - "Develop skills in psychological assessment, counseling, and human resource management."
      - "Promote mental health awareness and community-based psychological interventions."
    outcomes:
      - "Apply psychological principles to assess and address individual and organizational needs."
      - "Conduct empirical research adhering to ethical guidelines in psychology."
      - "Demonstrate empathy, cultural sensitivity, and professional integrity in client interactions."
    careerOpportunities:
      - "Clinical / Counseling Psychologist (with further study)"
      - "Human Resources Specialist"
      - "Psychometrician"
      - "Student Guidance Counselor"
      - "Research Assistant / Data Analyst"

# ---------------------------------------------------------------------------
# INSTITUTIONAL LEARNING OUTCOMES
# ---------------------------------------------------------------------------
academics:
  institutionalOutcomes:
    - "Demonstrate professional and ethical competence in communication and psychological practice."
    - "Apply critical thinking and evidence-based problem-solving in human and media contexts."
    - "Communicate effectively and empathetically across diverse cultural settings."
    - "Work collaboratively in multi-disciplinary teams to address community needs."
    - "Commit to lifelong learning and the promotion of mental health and media literacy."
  outcomesCommonToAllHEIs:
    - "Articulate and discuss the latest developments in the specific field of practice."
    - "Effectively communicate orally and in writing using both English and Filipino."
    - "Work effectively and independently in multi-disciplinary and multi-cultural teams."
    - "Act in recognition of professional, social, and ethical responsibility."
    - "Preserve and promote Filipino historical and cultural heritage."
  pathfit: "All students complete Physical Activity Towards Health and Fitness (PATHFIT) subjects, promoting holistic well-being, which is essential for managing the emotional and physical demands of human-centered professions."
  advocacy: "SOH is a strong advocate for mental health awareness, media literacy, and inclusive communication. Through the Peer Facilitators' Circle and community outreach, students actively conduct psychological first aid, anti-stigma campaigns, and free media literacy workshops in Dagupan and neighboring communities."