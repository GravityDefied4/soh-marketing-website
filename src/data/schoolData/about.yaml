# DEAN'S MESSAGE
# ---------------------------------------------------------------------------
dean:
  name: "Ma. Rizza Aquino-Bartolo, RPm"
  title: "Dean and Guidance Head, School of Humanities"
  message: "Welcome to the School of Humanities. At UdD, we believe that understanding the human mind and mastering the art of communication are the foundations of meaningful societal change. Our programs are designed to nurture empathy, critical inquiry, and ethical leadership. I invite you to join our vibrant Panther community and turn your passion into purpose."

