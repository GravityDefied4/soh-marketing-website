# ---------------------------------------------------------------------------
# SCHOOL HISTORY & FUTURE DIRECTION
# ---------------------------------------------------------------------------
about:
  history: "The School of Humanities was established to address the growing need for empathetic, articulate, and scientifically grounded professionals in Pangasinan and beyond. From its foundational years, SOH has grown into a hub for mental health advocacy and media excellence, consistently producing graduates who excel in psychology, communication, and human services."
  future: "SOH is committed to expanding its community-based psychological interventions and digital communication laboratories. We envision a future where our graduates lead in mental health innovation, ethical journalism, and inclusive corporate communication, driving national development through human-centered solutions."

  # Vision, mission, and core values
  vision: "A premier school of humanities in the region, producing empathetic, articulate, and socially responsible professionals who champion mental health and ethical communication."
  mission: "To provide quality, accessible education in communication and psychology through immersive learning, research, and community engagement, fostering holistic development and ethical leadership."

  # Core values — each item needs a title, description, and icon name.
  # Available icons: Star, Shield, Lightbulb, Heart, Award, BookOpen, Users, Target
  coreValues:
    - title: "Empathy"
      description: "We prioritize understanding, compassion, and respect for the human experience in all our interactions."
      icon: "Heart"
    - title: "Integrity"
      description: "We uphold truth in media and ethical standards in psychological practice and research."
      icon: "Shield"
    - title: "Innovation"
      description: "We embrace new media technologies and evidence-based psychological approaches."
      icon: "Lightbulb"
    - title: "Service"
      description: "We are dedicated to uplifting communities through mental health advocacy and accessible communication."
      icon: "Users"

  # Timeline — add or remove milestones as needed. Keep year as a 4-digit string.
  timeline:
    - year: "2008"
      event: "School of Humanities formally established with BA Communication and BS Psychology programs."
    - year: "2015"
      event: "Launch of the SOH Peer Facilitators' Circle for student mental health support."
    - year: "2019"
      event: "Opening of the SOH Media Laboratory and Psychology Assessment Center."
    - year: "2023"
      event: "SOH students win top honors in regional media and psychology case study competitions."
    - year: "2024"
      event: "Dean Ma. Rizza Aquino-Bartolo leads university-wide mental health and guidance initiatives."
    - year: "2025"
      event: "SOH 'Panthers' dominate university intramurals, showcasing unity and Panther pride."