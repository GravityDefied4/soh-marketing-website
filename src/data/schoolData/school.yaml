# =============================================================================
# SCHOOL BRAND IDENTITY
# Edit this file to update the school's name, tagline, colors, and social media.
# =============================================================================

university:
  name: "Universidad de Dagupan"
  website: "https://udd.edu.ph"
  address: "Arellano St., Dagupan City, Pangasinan, Philippines"

school:
  name: "School of Humanities"
  abbreviation: "SOH"
  slug: "soh"
  tagline: "Shape the Future. Understand the Mind. Master the Message."
  description: "The School of Humanities at Universidad de Dagupan is dedicated to producing empathetic, articulate, and socially responsible professionals in the fields of communication and psychology."
  primaryColor: "#6b21a8"
  secondaryColor: "#4c1d95"

  # ---------------------------------------------------------------------------
  # SCHOOL LOGO
  # ---------------------------------------------------------------------------
  # HOW TO ADD A LOGO:
  #   1. Save your logo file inside the "public/images/" folder.
  #      Example file path on your computer: public/images/logo.webp
  #      Recommended: WebP with transparent background, at least 400×400 px.
  #   2. Set the value below to just the filename (no leading slash):
  #        logo: "logo.webp"
  #   3. Leave it as "" (empty) to show the school name as text instead.
  logo: "soh-logo.webp"

# Social media links — paste the full URL or leave as "" to hide the icon.
socialMedia:
  facebook: "https://www.facebook.com/uddsoh"
  instagram: ""
  twitter: ""
  youtube: ""

