# =============================================================================
# NEWS  (shown on the News page and as a preview on the landing page)
# =============================================================================

# LAYOUT VARIANT — choose ONE:
#
#   featured-lead - First article shown large at the top (full-width banner),
#                   remaining articles shown in a grid below. Best default.
#
#   grid          - All articles shown in equal-sized cards in a grid.
#                   Good when no single article is more important than others.
#
variant: grid

# ---------------------------------------------------------------------------
# NEWS ARTICLES
# ---------------------------------------------------------------------------
# For each article:
#   id      — A unique slug used in the URL. Use only lowercase letters,
#             numbers, and hyphens. No spaces. (e.g., "sba-wins-at-olympíad")
#   title   — Short title shown in lists and cards
#   headline — Longer display headline shown inside the full article
#   author  — Who wrote the article
#   date    — Format: YYYY-MM-DD (e.g., 2024-03-10)
#   excerpt — One or two sentence summary shown on cards
#   story   — The full article text. Use \n\n to separate paragraphs.
#
# HOW TO ADD A NEWS COVER PHOTO:
#   1. Save the photo inside "public/images/news/" folder.
#      Ideal size: 1200×630 px (16:9 ratio). Format: WebP.
#      Example: public/images/news/accounting-olympiad.webp
#   2. Set the image value to just the filename with subfolder:
#        image: "news/accounting-olympiad.webp"
#   3. Leave as "" to show a colored placeholder.
#
# HOW TO ADD PHOTOS INSIDE AN ARTICLE (the photos[] list):
#   Same steps as above — save in the same folder, then set the image path.
#   Add a caption to describe each photo.
news:
  - id: "soh-research-parenting-styles-first-place"
    title: "SOH Students Win 1st Place for Parenting Styles Research"
    headline: "School of Humanities Students Excel in Regional Research Competition"
    author: "SOH Communications Office"
    date: "2025-03-15"
    excerpt: "SOH student researchers earned first place for their groundbreaking study on 'The Role of Parenting Styles in Child Development,' showcasing the school's commitment to excellence in psychological research."
    story: "The School of Humanities celebrates a remarkable achievement as student researchers from the BS Psychology program secured first place in a regional research competition for their study titled 'The Role of Parenting Styles in Child Development.'\n\nThe research examined the impact of authoritative, authoritarian, and permissive parenting styles on children's socio-emotional development, contributing valuable insights to the field of developmental psychology in the Philippine context.\n\n'This achievement demonstrates the quality of research training our psychology students receive,' said SOH Dean Ma. Rizza Aquino-Bartolo. 'Their work has real-world implications for families and educators in our community.'\n\nThe research team presented their findings to a panel of expert judges from leading universities, earning top honors for methodology, analysis, and practical applications."
    image: ""
    photos:
      - image: ""
        caption: "SOH research team presents their award-winning study"

  - id: "soh-musical-championship-2024"
    title: "SOH Emerges as Musical Champion at UdD Anniversary"
    headline: "School of Humanities Showcases Talent with Musical Victory"
    author: "SOH Communications Office"
    date: "2024-08-20"
    excerpt: "The School of Humanities demonstrated their artistic excellence by winning the musical competition during Universidad de Dagupan's anniversary celebration, solidifying their place as UdD's musical champions."
    story: "The School of Humanities (SOH) showcased their creative talents by emerging victorious in the musical competition during Universidad de Dagupan's anniversary celebration, solidifying their place as UdD's musical champions.\n\nThe competition featured performances from all schools within the university, with SOH students delivering a powerful and memorable performance that captivated judges and audiences alike. The victory highlighted the school's commitment to developing well-rounded graduates who excel not only academically but also in creative and artistic pursuits.\n\n'This achievement reflects the Panther spirit—united, talented, and proud,' said an SOH student leader. 'We're not just studying humanities; we're living them through our performances and creative expression.'\n\nThe performance featured original compositions and arrangements that celebrated Filipino culture and the humanities, earning standing ovations from the audience."
    image: ""
    photos:
      - image: ""
        caption: "SOH students perform their championship-winning musical number"

  - id: "soh-peer-facilitators-circle-milestone"
    title: "SOH Peer Facilitators' Circle Reaches 10th Anniversary"
    headline: "A Decade of Mental Health Advocacy and Student Support"
    author: "SOH Communications Office"
    date: "2025-02-04"
    excerpt: "The SOH Peer Facilitators' Circle celebrated its 10th anniversary, marking a decade of dedicated mental health advocacy, peer support, and psychological well-being initiatives within the university community."
    story: "The School of Humanities celebrated a significant milestone as the Peer Facilitators' Circle (PFC) marked its 10th anniversary on February 4, 2025, at the UdD Audio Visual Theater. The event symbolized a meaningful step forward in the school's commitment to student mental health and well-being.\n\nOver the past decade, the PFC has trained hundreds of student peer facilitators who provide emotional support, conduct mental health awareness campaigns, and create safe spaces for students to discuss their concerns. The program has become a model for peer-led mental health initiatives in higher education.\n\n'The Peer Facilitators' Circle embodies our mission to develop empathetic, socially responsible professionals,' said Dean Ma. Rizza Aquino-Bartolo, who also serves as the Guidance Head. 'Our students learn that psychology is not just a field of study—it's a calling to serve and uplift others.'\n\nThe anniversary celebration featured testimonials from PFC alumni, a panel discussion on mental health trends, and a commitment ceremony for new peer facilitators."
    image: ""
    photos:
      - image: ""
        caption: "Peer Facilitators' Circle members celebrate their 10th anniversary"

  - id: "soh-alumni-connect-leadership-series"
    title: "SOH Launches Alumni Connect Leadership Series"
    headline: "School of Humanities Celebrates Distinguished Alumni Success Stories"
    author: "SOH Communications Office"
    date: "2025-06-23"
    excerpt: "SOH launched its Alumni Connect series, featuring successful graduates who exemplify leadership and excellence in their respective fields, inspiring current students to pursue their passions."
    story: "The School of Humanities launched its highly anticipated Alumni Connect series, showcasing the remarkable achievements of SOH graduates who have made significant contributions in communication, psychology, and related fields.\n\nThe series, titled 'Echoes of Leadership,' features episodes highlighting alumni who demonstrate that leadership is more than holding a position—it's about making a positive impact. Featured alumni include successful media practitioners, clinical psychologists, human resource leaders, and social entrepreneurs.\n\n'Their stories matter,' said the SOH administration. 'By sharing their journeys, we inspire current students to see the endless possibilities that a humanities education can offer. These alumni are proof that SOH prepares graduates not just for careers, but for meaningful lives of service and leadership.'\n\nThe series has received overwhelming support from the SOH community, with students expressing appreciation for the real-world insights and motivation provided by successful alumni."
    image: ""
    photos:
      - image: ""
        caption: "SOH Alumni Connect series features distinguished graduates"